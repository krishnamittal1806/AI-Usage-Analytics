spring.application.name=consumer-service
spring.kafka.bootstrap-servers=localhost:9092
# Keep one stable group so consumers share partitions and resume from committed offsets.
spring.kafka.consumer.group-id=analytics-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Commit each record after successful listener processing to limit replay to the failed record.
spring.kafka.listener.ack-mode=record
app.kafka.topic=analytics-events
