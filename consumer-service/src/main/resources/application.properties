spring.application.name=consumer-service
spring.kafka.bootstrap-servers=localhost:9092
# Keep one stable group so consumers share partitions and resume from committed offsets.
spring.kafka.consumer.group-id=analytics-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Commit each record after successful listener processing to limit replay to the failed record.
spring.kafka.listener.ack-mode=record
app.kafka.topic=analytics-events
spring.datasource.url=jdbc:postgresql://localhost:5433/analytics
spring.datasource.username=${DB_USER:analytics}
spring.datasource.password=${DB_PASSWORD:analytics_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
